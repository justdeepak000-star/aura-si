name: Build AURA APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CAP_SERVER_URL: https://aura-artifical.lovable.app
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android platform (preinstalled SDK)
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          ls "$SM"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
          echo "sdk.dir=$SDK" > android/local.properties

      - name: Install dependencies
        run: bun install || npm install --legacy-peer-deps --no-audit --no-fund

      - name: Prepare web shell
        run: |
          mkdir -p dist
          echo '<!doctype html><html><body>Loading AURA...</body></html>' > dist/index.html

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: AURA-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AURA-playstore-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
