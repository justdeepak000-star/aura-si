name: Build AURA Desktop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Copy companion and icon
        shell: bash
        run: |
          cp ../public/companion/aura-companion.mjs .
          cp ../public/aura-icon.png icon.png
      - run: npm install --no-audit --no-fund
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Publish to desktop-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: AURA Desktop (latest)
          files: |
            desktop/dist/Aura-Setup.exe
            desktop/dist/Aura.dmg
            desktop/dist/Aura.AppImage
          fail_on_unmatched_files: false
